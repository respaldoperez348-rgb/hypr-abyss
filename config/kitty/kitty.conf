# ==============================================================================
# Kitty Terminal Configuration (Translucent Cyberpunk / Frosted Glass)
# ==============================================================================

# Tipografía
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Transparencia y estética de ventana
background_opacity         0.75
dynamic_background_opacity yes
window_padding_width       10
confirm_os_window_close    0

# Control remoto habilitado para recarga de colores en caliente
allow_remote_control yes
listen_on            unix:@mykitty

# Cursor estilo terminal hacker
cursor_shape               beam
cursor_blink_interval      0.6
cursor_beam_thickness      1.5

# Opciones de scroll y rendimiento
scrollback_lines           10000
wheel_scroll_multiplier    3.0
repaint_delay              10
input_delay                3
sync_to_monitor            yes

# Decoración de ventana
hide_window_decorations    yes

# Importar tema activo (sincronizado con el Setup actual)
include ~/.config/kitty/theme.conf
shell fish
