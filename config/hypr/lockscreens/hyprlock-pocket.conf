# ==============================================================================
# Dolphin Hyprland - Lockscreen Pocket Style (Dynamic Island Notch)
# ==============================================================================

source = ~/.config/hypr/configs/configs.conf

background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    color = rgba(12, 16, 23, 1.0)
    blur_passes = 3
    blur_size = 6
    contrast = 1.05
    brightness = 0.90
    vibrancy = 1.1
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

# Cápsula Notch Superior
label {
    monitor =
    text = ⚡ POCKET ISLAND // SECURE SYSTEM
    color = rgba(224, 86, 253, 0.90)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -40
    halign = center
    valign = top
}

# Reloj Digital Pocket
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(241, 242, 246, 0.95)
    font_size = 80
    font_family = Outfit, JetBrainsMono Nerd Font, sans-serif
    position = 0, 80
    halign = center
    valign = center
}

# Fecha Sencilla
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(0, 242, 254, 0.85)
    font_size = 15
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 15
    halign = center
    valign = center
}

# Input Field Cápsula Pocket
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(224, 86, 253, 0.6) rgba(0, 242, 254, 0.6) 45deg
    inner_color = rgba(13, 17, 23, 0.85)
    font_color = rgb(241, 242, 246)
    fade_on_empty = false
    placeholder_text = <i>󰌾 Desbloquear Pocket...</i>
    placeholder_color = rgba(255, 255, 255, 0.4)
    hide_input = false
    rounding = 25
    check_color = rgb(0, 242, 254)
    fail_color = rgb(255, 71, 87)
    fail_text = <i>Contraseña Incorrecta ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}
