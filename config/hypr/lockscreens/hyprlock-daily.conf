# ==============================================================================
# Dolphin Hyprland - Lockscreen Daily Style (Zen Glass Pastel)
# ==============================================================================

source = ~/.config/hypr/configs/configs.conf

background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    color = rgba(246, 248, 250, 1.0)
    blur_passes = 2
    blur_size = 5
    contrast = 1.0
    brightness = 0.95
    vibrancy = 1.0
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

# Reloj Minimalista Zen
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(36, 41, 47, 0.90)
    font_size = 96
    font_family = Inter, sans-serif
    position = 0, 140
    halign = center
    valign = center
}

# Fecha Sencilla
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(87, 96, 106, 0.85)
    font_size = 18
    font_family = Inter, sans-serif
    position = 0, 70
    halign = center
    valign = center
}

# Input Field Esmerilado Suave
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(9, 105, 218, 0.4)
    inner_color = rgba(255, 255, 255, 0.70)
    font_color = rgba(36, 41, 47, 0.9)
    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = <i><span foreground="##57606a">󰌾 Password...</span></i>
    hide_input = false
    rounding = -1
    check_color = rgba(46, 160, 67, 1.0)
    fail_color = rgba(207, 34, 46, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -40
    halign = center
    valign = center
}
