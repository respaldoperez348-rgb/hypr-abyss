# ==============================================================================
# Dolphin Hyprland - Lockscreen Dev Style (Shell Ninja Cockpit HUD - Imagen 4)
# ==============================================================================

source = ~/.config/hypr/configs/configs.conf

# Fondo con desenfoque de alta fidelidad
background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    color = rgba(13, 17, 23, 1.0)
    blur_passes = 3
    blur_size = 7
    contrast = 0.95
    brightness = 0.82
    vibrancy = 1.0
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

# 1. Reloj Digital Principal (Top Center)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgba(240, 246, 252, 0.95)
    font_size = 86
    font_family = JetBrains Mono Nerd Font ExtraBold, Montserrat, sans-serif
    position = 0, 310
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# 2. Subtítulo con Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(0, 255, 204, 0.90)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Medium, sans-serif
    position = 0, 232
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# 3. Avatar Circular Neón (User Face Ring)
image {
    monitor =
    path = $HOME/.face.png
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgba(0, 255, 204, 0.95)
    position = 0, 75
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 255, 204, 0.3)
}

# 4. Nombre de Usuario / Shell Ninja
label {
    monitor =
    text = Shell Ninja
    color = rgba(240, 246, 252, 0.95)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Bold, sans-serif
    position = 0, -10
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# 5. Campo de Contraseña en Píldora Frosted Glass
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 255, 204, 0.85)
    inner_color = rgba(13, 17, 23, 0.85)
    font_color = rgba(240, 246, 252, 1.0)
    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = <i><span foreground="##8b949e">󰌾  Enter Password...</span></i>
    hide_input = false
    rounding = -1
    check_color = rgba(80, 250, 123, 1.0)
    fail_color = rgba(255, 85, 85, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 250
    capslock_color = rgba(255, 184, 108, 1.0)
    numlock_color = rgba(139, 233, 253, 1.0)
    bothlock_color = rgba(189, 147, 249, 1.0)
    invert_numlock = false
    swap_font_color = false
    position = 0, -82
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# 6. Cápsula Inferior de Telemetría (CPU, RAM, Disco, Uptime)
label {
    monitor =
    text = cmd[update:2000] echo " CPU: $(grep 'cpu ' /proc/stat | awk '{print int(($2+$4)*100/($2+$4+$5))}')%   |    RAM: $(free -m | awk '/Mem:/ {print int($3/$2*100)}')%   |   󰋊 DISK: $(df -h / | awk 'NR==2 {print $5}')   |    UP: $(uptime -p | sed 's/up //')"
    color = rgba(240, 246, 252, 0.85)
    font_size = 11
    font_family = JetBrains Mono Nerd Font Medium, monospace
    position = 0, 36
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
}
